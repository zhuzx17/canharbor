[package]
name = "canharbor-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
[dependencies]
canharbor-platform = { path = "../canharbor-platform" }
canharbor-ipc = { path = "../canharbor-ipc" }
canharbor-api = { path = "../canharbor-api" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"
futures-util.workspace = true
[dev-dependencies]
canharbor-server.workspace = true
canharbor-virtual.workspace = true
canharbor-core.workspace = true

[dependencies.hyper]
version = "1"
features = ["client", "http1"]
[dependencies.hyper-util]
version = "0.1"
features = ["tokio"]
[dependencies.http-body-util]
version = "0.1"
