[package]
name = "canharbor-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
