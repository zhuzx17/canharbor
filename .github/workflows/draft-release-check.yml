name: Draft release rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Create run-owned temporary tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/draft-release-check.py create
  package:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
  verify:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    # Draft releases require push access even for listing/downloading.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: canharbor-*
          path: workflow-artifacts
          merge-multiple: false
      - name: Verify unpublished draft and all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          OWNED_TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
        run: python3 scripts/draft-release-check.py verify --artifacts-dir workflow-artifacts
  cleanup:
    if: ${{ always() }}
    needs: [prepare, package, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Remove only this run's unpublished draft and temporary tag
        env:
          GH_TOKEN: ${{ github.token }}
          OWNED_TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
        run: python3 scripts/draft-release-check.py cleanup
