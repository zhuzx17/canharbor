name: Package
on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing tag to build as an unpublished draft'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and prepare as a draft release; leave empty for workflow artifacts only'
        required: false
        type: string
permissions:
  contents: read
jobs:
  package:
    uses: ./.github/workflows/package-build.yml
    with:
      tag: ${{ inputs.tag || '' }}
  release-draft:
    if: inputs.tag != ''
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: canharbor-*
          path: release-assets
          merge-multiple: true
      - name: Verify archives and prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd release-assets
          sha256sum --check ./*.sha256
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r .isDraft release-state.json)" = true || { echo 'Refusing to modify a published release.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "CANHarbor $RELEASE_TAG" --notes-file ../docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.zip ./*.sha256 --clobber
